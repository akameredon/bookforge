name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  source-and-browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Run source and real-browser tests
        run: npm run test:all
      - name: Install Java for EPUBCheck
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download official EPUBCheck 5.4.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip \
            --output /tmp/epubcheck.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          EPUBCHECK_JAR="$(find /tmp/epubcheck -type f -name 'epubcheck.jar' -print -quit)"
          test -n "$EPUBCHECK_JAR"
          echo "EPUBCHECK_JAR=$EPUBCHECK_JAR" >> "$GITHUB_ENV"
          java -jar "$EPUBCHECK_JAR" --version
      - name: Validate exported EPUB against EPUB 3.4
        run: java -jar "$EPUBCHECK_JAR" test-results/bookforge-sample.epub
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookforge-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            package-lock.json
          if-no-files-found: ignore
          retention-days: 14
